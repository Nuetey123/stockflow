<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - StockFlow RAHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Page Specific Layout Styles -->
    <style>
        .sales-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; height: calc(100vh - 100px); }
        .product-section { background: white; border-radius: 12px; padding: 20px; overflow-y: auto; }
        .cart-section { background: white; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .search-bar { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; margin-bottom: 20px; font-size: 1rem; }
        .search-bar:focus { border-color: var(--primary-lilac); outline: none; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #eee; border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.2s; text-align: center; background: #fff; }
        .product-card:hover { transform: translateY(-3px); border-color: var(--primary-lilac); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card h4 { font-size: 0.85rem; color: #333; margin-bottom: 5px; height: 40px; overflow: hidden; }
        .product-card .price { color: var(--dark-lilac); font-weight: bold; font-size: 1.1rem; }
        .product-card .stock-badge { font-size: 0.75rem; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; color: #666; }

        .cart-header { border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 15px; }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .cart-item-info h5 { font-size: 0.9rem; margin-bottom: 3px; }
        .cart-item-info span { font-size: 0.8rem; color: #666; }
        .cart-item-actions { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 25px; height: 25px; border-radius: 50%; border: 1px solid #ddd; background: white; cursor: pointer; }

        .cart-total { background: #f9f5ff; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .cart-total h2 { color: var(--dark-lilac); font-size: 2rem; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--accent-gold); color: #333; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        .checkout-btn:hover { background: #e0c050; }
    </style>
</head>
<body class="dashboard-body">

    <div class="app-container">
        <!-- Sidebar (Same as Dashboard) -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-school"></i>
                <h2>StockFlow<br><span>RAHA</span></h2>
            </div>
            <nav class="menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="inventory.html"><i class="fas fa-box-open"></i> Inventory</a>
                <a href="sales.html" class="active"><i class="fas fa-shopping-cart"></i> Sales</a>
                <a href="reports.html"><i class="fas fa-file-invoice-dollar"></i> Reports</a>
            </nav>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=C8A2D9&color=fff" alt="User">
                <div class="info">
                    <h4>Administrator</h4>
                    <p>Online</p>
                </div>
                <a href="index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </aside>

        <!-- Main Sales Interface -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>New Sale</h1>
                    <p>Select items to add to cart</p>
                </div>
                <div class="week-indicator">
                    <span class="badge">Week 11 (2026)</span>
                </div>
            </header>

            <div class="sales-container">
                <!-- Left: Product Grid -->
                <section class="product-section">
                    <input type="text" id="product-search" class="search-bar" placeholder="Search by name, size, or category...">
                    <div class="product-grid" id="product-grid">
                        <!-- Products injected via JS -->
                    </div>
                </section>

                <!-- Right: Cart -->
                <section class="cart-section">
                    <div class="cart-header">
                        <h3><i class="fas fa-receipt"></i> Current Order</h3>
                    </div>
                    <div class="cart-items" id="cart-items">
                        <p style="text-align:center; color:#999; margin-top:50px;">Cart is empty</p>
                    </div>
                    <div class="cart-total">
                        <p>Total Amount</p>
                        <h2 id="cart-total-display">GH¢ 0.00</h2>
                    </div>
                    <button class="checkout-btn" onclick="processCheckout()">Complete Sale</button>
                </section>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/sales.js"></script>
</body>
</html>

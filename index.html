<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow RAHA - Access Portal</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container" id="container">

        <!-- SIGN UP FORM -->
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>
                <span>Join the StockFlow System</span>

                <div class="input-group">
                    <input type="text" id="signupUsername" placeholder="Username" required />
                </div>
                <div class="input-group">
                    <input type="text" id="signupFullName" placeholder="Full Name" required />
                </div>
                <div class="input-group">
                    <input type="email" id="signupEmail" placeholder="Email" required />
                </div>
                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder="Password" required />
                    <i class="fas fa-eye input-icon" onclick="togglePassword('signupPassword', this)"></i>
                </div>
                <div class="input-group">
                    <select id="signupRole" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="staff">Staff Member</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <button type="submit">Sign Up</button>
                <p class="error-message" id="signupError"></p>
            </form>
        </div>

        <!-- SIGN IN FORM -->
        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign in</h1>
                <span>Use your account</span>

                <div class="input-group">
                    <input type="email" id="signinEmail" placeholder="Email" required />
                </div>
                <div class="input-group">
                    <input type="password" id="signinPassword" placeholder="Password" required />
                    <i class="fas fa-eye input-icon" onclick="togglePassword('signinPassword', this)"></i>
                </div>

                <a href="#" style="font-size: 0.875rem; color: #666; margin: 0.5rem 0;">Forgot your password?</a>
                <button type="submit">Sign In</button>
                <p class="error-message" id="signinError"></p>
            </form>
        </div>

        <!-- OVERLAY PANELS -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your details to manage Raha's inventory.</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Join us to track uniforms, sales, and stock efficiently.</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Only the Auth Logic Script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>

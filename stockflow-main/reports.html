<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports - StockFlow RAHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary-purple: #6b21a8; 
            --success-green: #10b981; 
            --danger-red: #ef4444; 
            --warning-orange: #f59e0b;
            --text-main: #1f2937; 
            --text-muted: #6b7280; 
            --border-light: #e5e7eb; 
            --bg-card: #ffffff; 
        }
        
        .reports-grid { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 24px; 
            margin-top: 24px; 
            align-items: start; 
        }
        
        .filter-bar { 
            background: var(--bg-card); 
            padding: 16px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-light); 
            display: flex; 
            gap: 16px; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
        }
        
        .form-select { 
            padding: 10px 14px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            min-width: 180px; 
        }
        
        .kpi-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; 
            margin-top: 24px; 
        }
        
        .kpi-card { 
            background: var(--bg-card); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-light); 
        }
        
        .chart-card { 
            background: var(--bg-card); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-light); 
            height: 340px; 
        }
        
        .data-table-card { 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border-light); 
            padding: 24px; 
        }
        
        .custom-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 12px; 
        }
        
        .custom-table th { 
            background: #f9fafb; 
            padding: 14px 16px; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            border-bottom: 2px solid var(--border-light); 
        }
        
        .custom-table td { 
            padding: 14px 16px; 
            border-bottom: 1px solid var(--border-light); 
        }
        
        .btn-excel { 
            background: var(--success-green); 
            color: white; 
            padding: 10px 18px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            margin-left: auto; 
        }
        
        .btn-excel:hover {
            background: #059669;
        }
        
        /* Color classes for low stock alerts */
        .text-critical { 
            color: #ef4444; 
            font-weight: 600;
        }
        
        .text-warning { 
            color: #f59e0b; 
            font-weight: 600;
        }
        
        .text-low { 
            color: #10b981; 
            font-weight: 600;
        }
        
        @media (max-width: 1024px) { 
            .reports-grid { 
                grid-template-columns: 1fr; 
            } 
        }
    </style>
</head>
<body class="dashboard-body">

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-school"></i>
                <h2>StockFlow<br><span>RAHA</span></h2>
            </div>
            <nav class="menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="inventory.html"><i class="fas fa-box-open"></i> Inventory</a>
                <a href="sales.html"><i class="fas fa-shopping-cart"></i> Sales</a>
                <a href="reports.html" class="active"><i class="fas fa-file-invoice-dollar"></i> Reports</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar" style="margin-bottom: 24px;">
                <h1>Analytics & Reporting</h1>
            </header>

            <section class="filter-bar">
                <select id="report-type" class="form-select">
                    <option value="sales">View: Sales Transactions</option>
                    <option value="restocks">View: Logistical Restocks</option>
                </select>
                
                <select id="report-period" class="form-select" onchange="toggleWeekDropdown(this.value)">
                    <option value="TERM">Entire Term</option>
                    <option value="WEEKLY">Specific Past Week</option>
                </select>

                <select id="week-selector-list" class="form-select" style="display: none;">
                    <option value="">Select a week...</option>
                </select>

                <button id="export-report-btn" class="btn-excel">
                    <i class="fas fa-file-excel"></i> Export
                </button>
            </section>

            <section class="kpi-container">
                <div class="kpi-card">
                    <p>Performance Value</p>
                    <h3 id="report-revenue">GH¢ 0.00</h3>
                </div>
                <div class="kpi-card">
                    <p>Volume Outflow</p>
                    <h3 id="report-units">0</h3>
                </div>
                <div class="kpi-card">
                    <p>Dominant Category</p>
                    <h3 id="report-top-cat">Loading...</h3>
                </div>
            </section>

            <div class="reports-grid">
                <section style="display: flex; flex-direction: column; gap: 24px;">
                    <div class="data-table-card">
                        <h3>Top Performing Stock Items</h3>
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Volume</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody id="top-sellers-body"></tbody>
                        </table>
                    </div>
                    <div class="chart-card">
                        <canvas id="categoryChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <canvas id="trendChart"></canvas>
                    </div>
                </section>

                <aside style="display: flex; flex-direction: column; gap: 24px;">
                    <div class="data-table-card" style="border-top: 4px solid var(--danger-red);">
                        <h3>Threshold Reorder Alerts</h3>
                        <table class="custom-table">
                            <tbody id="low-stock-body"></tbody>
                        </table>
                    </div>
                    <div class="data-table-card">
                        <h3>Run Diagnostics</h3>
                        <div id="quick-stats">System active. Ready to process logs.</div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script>
        // Toggle the visibility of the new dynamic dropdown
        function toggleWeekDropdown(val) {
            const dropdown = document.getElementById('week-selector-list');
            dropdown.style.display = (val === 'WEEKLY') ? 'block' : 'none';
        }
    </script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/stateManager.js"></script>
    <script src="assets/js/reports.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar - StockFlow RAHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-secondary { background: #e5e7eb; color: #374151; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .nav-tabs { border-bottom: 2px solid #e5e7eb; margin-bottom: 1rem; list-style: none; padding: 0; display: flex; }
        .nav-tabs li { margin-right: 1rem; }
        .nav-tabs a { text-decoration: none; color: #6b7280; padding: 0.5rem 1rem; display: block; border-bottom: 2px solid transparent; }
        .nav-tabs a.active { color: #7c3aed; border-bottom-color: #7c3aed; font-weight: 600; }
        .form-control, .form-select { padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; width: 100%; margin-bottom: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #7c3aed; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
        .d-flex { display: flex; }
        .gap-2 { gap: 0.5rem; }
        .justify-content-between { justify-content: space-between; }
        .align-items-center { align-items: center; }
        .border-bottom { border-bottom: 1px solid #e5e7eb; }
        .p-2 { padding: 0.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .small { font-size: 0.875rem; }
        .text-muted { color: #6b7280; }
        .list-item-row { padding: 10px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="dashboard-body">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-school"></i>
                <h2>StockFlow<br><span>RAHA</span></h2>
            </div>
            <nav class="menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="inventory.html"><i class="fas fa-box-open"></i> Inventory</a>
                <a href="academic-calendar.html" class="active"><i class="fas fa-calendar-alt"></i> Academic Calendar</a>
                <a href="sales.html"><i class="fas fa-shopping-cart"></i> Sales</a>
                <a href="#"><i class="fas fa-file-invoice-dollar"></i> Reports</a>
            </nav>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=C8A2D9&color=fff" alt="User">
                <div class="info">
                    <h4 id="user-display-name">Administrator</h4>
                    <p id="user-display-email">Online</p>
                </div>
                <a href="#" onclick="handleLogout(event)" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Academic Calendar Setup</h1>
                    <p>Manage Years, Terms, and Weeks. Open weeks to carry forward stock.</p>
                </div>
            </header>

            <div class="card">
                <div class="card-body">
                    <ul class="nav-tabs" id="adminTabs">
                        <li><a class="active" href="#" id="tab-link-years" onclick="switchTab('years'); return false;">📅 Academic Years</a></li>
                        <li><a href="#" id="tab-link-terms" onclick="switchTab('terms'); return false;">📚 Terms</a></li>
                        <li><a href="#" id="tab-link-weeks" onclick="switchTab('weeks'); return false;">🗓️ Weeks</a></li>
                    </ul>

                    <!-- Years Tab -->
                    <div id="tab-years">
                        <form id="add-year-form" class="d-flex gap-2 mb-3 flex-wrap">
                            <input type="text" id="year-name" class="form-control" placeholder="Year Name (e.g., 2025/2026)" style="flex:2;" required>
                            <input type="date" id="year-start" class="form-control" style="flex:1;" required>
                            <input type="date" id="year-end" class="form-control" style="flex:1;" required>
                            <button type="submit" class="btn btn-primary">Add Year</button>
                        </form>
                        <div id="years-list" class="small"></div>
                    </div>

                    <!-- Terms Tab -->
                    <div id="tab-terms" class="hidden">
                        <div class="mb-3">
                            <label class="small">Select Academic Year:</label>
                            <select id="term-year-select" class="form-select" onchange="renderTermsList()"></select>
                        </div>
                        <form id="add-term-form" class="d-flex gap-2 mb-3 flex-wrap">
                            <input type="text" id="term-name" class="form-control" placeholder="Term Name" style="flex:2;" required>
                            <input type="number" id="term-number" class="form-control" placeholder="#" min="1" max="3" value="1" style="width:60px;" required>
                            <input type="date" id="term-start" class="form-control" style="flex:1;" required>
                            <input type="date" id="term-end" class="form-control" style="flex:1;" required>
                            <button type="submit" class="btn btn-primary">Add Term</button>
                        </form>
                        <div id="terms-list" class="small"></div>
                    </div>

                    <!-- Weeks Tab -->
                    <div id="tab-weeks" class="hidden">
                        <div class="mb-3">
                            <label class="small">Select Term:</label>
                            <select id="week-term-select" class="form-select" onchange="renderWeeksList()"></select>
                        </div>
                        <form id="add-week-form" class="d-flex gap-2 mb-3 flex-wrap">
                            <input type="text" id="week-name" class="form-control" placeholder="Week Name" style="flex:2;" required>
                            <input type="number" id="week-number" class="form-control" placeholder="#" min="1" style="width:60px;" required>
                            <input type="date" id="week-start" class="form-control" style="flex:1;" required>
                            <input type="date" id="week-end" class="form-control" style="flex:1;" required>
                            <button type="submit" class="btn btn-primary">Add Week</button>
                        </form>
                        <div id="weeks-list" class="small"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <!-- 1. Configuration File -->
    <script src="assets/js/config.js"></script>
    
    <!-- 2. State Engine Core -->
    <script src="assets/js/stateManager.js"></script>

    <!-- 3. Calendar Controller Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (!window.APP || typeof window.APP.init !== 'function') {
                console.error("❌ stateManager.js failed to load properly.");
                return;
            }

            // Boot state engine
            await window.APP.init();

            // Authentication verification check
            if (typeof window.APP.isAuthenticated === 'function' && !window.APP.isAuthenticated()) {
                if (window.location.protocol !== 'file:') {
                    window.location.href = window.CONFIG?.routes?.login || 'index.html';
                }
                return;
            }

            // Hydrate user profile info
            updateUserProfileUI();

            // Initial render
            renderYearsList();
            populateYearDropdowns();
            populateTermDropdowns();

        } catch (err) {
            console.error("Calendar initialization failed:", err);
        }
    });

    function updateUserProfileUI() {
        const user = window.APP?.user;
        if (!user) return;
        const fullName = user.full_name || user.username || "Admin";
        const nameEl = document.getElementById('user-display-name');
        const emailEl = document.getElementById('user-display-email');
        if (nameEl) nameEl.textContent = fullName.toUpperCase();
        if (emailEl) emailEl.textContent = user.email || 'Online';
    }

    async function handleLogout(e) {
        if (e) e.preventDefault();
        if (window.APP?.signOut) await window.APP.signOut();
    }

    /* =========================
       TAB SWITCHING
       ========================= */
    function switchTab(tabName) {
        ['years', 'terms', 'weeks'].forEach(t => {
            document.getElementById(`tab-${t}`)?.classList.add('hidden');
            document.getElementById(`tab-link-${t}`)?.classList.remove('active');
        });

        document.getElementById(`tab-${tabName}`)?.classList.remove('hidden');
        document.getElementById(`tab-link-${tabName}`)?.classList.add('active');

        if (tabName === 'years') renderYearsList();
        if (tabName === 'terms') {
            populateYearDropdowns();
            renderTermsList();
        }
        if (tabName === 'weeks') {
            populateTermDropdowns();
            renderWeeksList();
        }
    }

    /* =========================
       1. ACADEMIC YEARS
       ========================= */
    function renderYearsList() {
        const container = document.getElementById('years-list');
        const years = window.APP?.academic?.years || [];
        if (!container) return;

        if (years.length === 0) {
            container.innerHTML = `<div class="p-2 text-muted">No academic years created yet.</div>`;
            return;
        }

        container.innerHTML = years.map(y => `
            <div class="list-item-row">
                <div>
                    <strong>${y.name}</strong> 
                    <span class="text-muted">(${y.start_date || 'N/A'} - ${y.end_date || 'N/A'})</span>
                </div>
                <div>
                    <span class="badge ${y.is_active ? 'badge-success' : 'badge-secondary'}">
                        ${y.is_active ? 'ACTIVE' : 'INACTIVE'}
                    </span>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('add-year-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const supabase = window.APP?.supabase;
        if (!supabase) return;

        const name = document.getElementById('year-name').value.trim();
        const start_date = document.getElementById('year-start').value;
        const end_date = document.getElementById('year-end').value;

        try {
            const { data, error } = await supabase
                .from('academic_years')
                .insert({ name, start_date, end_date, is_active: true })
                .select();

            if (error) throw error;

            if (window.APP.showToast) window.APP.showToast('✅ Academic Year added!', 'success');
            e.target.reset();

            // Refresh state
            await window.APP._loadAcademic();
            renderYearsList();
            populateYearDropdowns();
        } catch (err) {
            if (window.APP.showToast) window.APP.showToast(err.message, 'error');
        }
    });

    /* =========================
       2. TERMS
       ========================= */
    function populateYearDropdowns() {
        const select = document.getElementById('term-year-select');
        if (!select) return;
        const years = window.APP?.academic?.years || [];
        
        select.innerHTML = years.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
    }

    function renderTermsList() {
        const container = document.getElementById('terms-list');
        const selectedYearId = document.getElementById('term-year-select')?.value;
        if (!container) return;

        const terms = (window.APP?.academic?.terms || []).filter(t => t.academic_year_id === selectedYearId);

        if (terms.length === 0) {
            container.innerHTML = `<div class="p-2 text-muted">No terms configured for this academic year.</div>`;
            return;
        }

        container.innerHTML = terms.map(t => `
            <div class="list-item-row">
                <div>
                    <strong>${t.name}</strong> (Term #${t.term_number || '1'})
                    <span class="text-muted">| ${t.start_date || ''} to ${t.end_date || ''}</span>
                </div>
                <div>
                    <span class="badge badge-secondary">${t.status || 'CLOSED'}</span>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('add-term-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const supabase = window.APP?.supabase;
        const yearId = document.getElementById('term-year-select')?.value;

        if (!supabase || !yearId) {
            alert('Please select an Academic Year first.');
            return;
        }

        const name = document.getElementById('term-name').value.trim();
        const term_number = parseInt(document.getElementById('term-number').value, 10);
        const start_date = document.getElementById('term-start').value;
        const end_date = document.getElementById('term-end').value;

        try {
            const { error } = await supabase.from('terms').insert({
                academic_year_id: yearId,
                name,
                term_number,
                start_date,
                end_date,
                status: 'UPCOMING'
            });

            if (error) throw error;

            if (window.APP.showToast) window.APP.showToast('✅ Term added successfully!', 'success');
            e.target.reset();

            await window.APP._loadAcademic();
            renderTermsList();
            populateTermDropdowns();
        } catch (err) {
            if (window.APP.showToast) window.APP.showToast(err.message, 'error');
        }
    });

    /* =========================
       3. WEEKS & STATUS TOGGLES
       ========================= */
    function populateTermDropdowns() {
        const select = document.getElementById('week-term-select');
        if (!select) return;
        const terms = window.APP?.academic?.terms || [];
        
        select.innerHTML = terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }

    function renderWeeksList() {
        const container = document.getElementById('weeks-list');
        const selectedTermId = document.getElementById('week-term-select')?.value;
        if (!container) return;

        const weeks = (window.APP?.academic?.weeks || []).filter(w => w.term_id === selectedTermId);

        if (weeks.length === 0) {
            container.innerHTML = `<div class="p-2 text-muted">No weeks found for this term.</div>`;
            return;
        }

        container.innerHTML = weeks.map(w => {
            const currentStatus = w.status || 'CLOSED';
            const isOpen = String(currentStatus).trim().toUpperCase() === 'OPEN';

            return `
                <div class="list-item-row">
                    <div>
                        <strong>${w.name}</strong> (Week #${w.week_number})
                        <br><span class="text-muted">${w.start_date || ''} - ${w.end_date || ''}</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge ${isOpen ? 'badge-success' : 'badge-secondary'}">
                            ${currentStatus.toUpperCase()}
                        </span>
                        <button class="btn btn-sm ${isOpen ? 'btn-danger' : 'btn-success'}" 
                                onclick="toggleWeekStatus('${w.id}', '${currentStatus}')">
                            ${isOpen ? 'Close Week' : 'Open Week'}
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('add-week-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const supabase = window.APP?.supabase;
        const termId = document.getElementById('week-term-select')?.value;

        if (!supabase || !termId) {
            alert('Please select a Term first.');
            return;
        }

        const name = document.getElementById('week-name').value.trim();
        const week_number = parseInt(document.getElementById('week-number').value, 10);
        const start_date = document.getElementById('week-start').value;
        const end_date = document.getElementById('week-end').value;

        try {
            const { error } = await supabase.from('term_weeks').insert({
                term_id: termId,
                name,
                week_number,
                start_date,
                end_date,
                status: 'CLOSED'
            });

            if (error) throw error;

            if (window.APP.showToast) window.APP.showToast('✅ Week created!', 'success');
            e.target.reset();

            await window.APP._loadAcademic();
            renderWeeksList();
        } catch (err) {
            if (window.APP.showToast) window.APP.showToast(err.message, 'error');
        }
    });

    async function toggleWeekStatus(weekId, currentStatus) {
        const supabase = window.APP?.supabase;
        if (!supabase) return;

        const isCurrentlyOpen = String(currentStatus).trim().toUpperCase() === 'OPEN';
        const newStatus = isCurrentlyOpen ? 'CLOSED' : 'OPEN';

        try {
            // Update selected week status in Supabase
            const { error } = await supabase
                .from('term_weeks')
                .update({ status: newStatus })
                .eq('id', weekId);

            if (error) throw error;

            if (window.APP.showToast) window.APP.showToast(`Week is now ${newStatus}`, 'success');

            // Refresh state manager and list view
            await window.APP._loadAcademic();
            renderWeeksList();
        } catch (err) {
            if (window.APP.showToast) window.APP.showToast(err.message, 'error');
        }
    }
    </script>
</body>
</html>
